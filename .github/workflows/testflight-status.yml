name: TestFlight processing status
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact marketing version (e.g. 1.17.0)
        required: true
        type: string
      build:
        description: Exact uploaded build number from the TestFlight workflow
        required: true
        type: string
      wait_minutes:
        description: Maximum polling minutes (1–60)
        default: '10'
        type: string
        required: true
permissions:
  contents: read
jobs:
  processing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check exact uploaded macOS build (read only)
        env:
          TESTFLIGHT_VERSION: ${{ inputs.version }}
          TESTFLIGHT_BUILD: ${{ inputs.build }}
          TESTFLIGHT_BUNDLE: com.stormkiln.nextround
          TESTFLIGHT_WAIT_MINUTES: ${{ inputs.wait_minutes }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: node scripts/testflight-status.mjs --status-only
