[package]
name = "nextround"
version = "1.11.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "nextround_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = { version = "2.13.1", optional = true }
tauri-plugin-opener = "2.7.0"

[features]
default = ["direct-update"]
direct-update = ["dep:tauri-plugin-updater"]

[dev-dependencies]
minisign-verify = "0.2.5"
base64 = "0.22"
