[package]
name = "nextround"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nextround_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
